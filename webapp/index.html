<!doctype html>
<html lang="uz-Cyrl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EC">
  <meta name="color-scheme" content="light">
  <title></title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="wordmark">
        <img class="wordmark__mark" src="assets/logo-mark.svg" alt="">
        <span class="wordmark__text"><span class="wordmark__primary" data-i18n="wordmarkPrimary"></span><em class="wordmark__secondary" data-i18n="wordmarkSecondary"></em></span>
      </div>
      <nav class="script-toggle" data-i18n-aria-label="scriptLabel">
        <button id="toggleCyr" type="button" data-script="cyr" data-i18n="toggleCyr"></button>
        <button id="toggleLat" type="button" data-script="lat" data-i18n="toggleLat"></button>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="heroTitle">
        <img class="hero__bg" src="assets/hero-bg.webp" width="1024" height="1536" alt="" decoding="async" fetchpriority="high">
        <div class="hero__content">
          <svg class="hero__mark" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="#C9A050" stroke-width="2"><ellipse cx="50" cy="50" rx="44" ry="15"/><ellipse cx="50" cy="50" rx="44" ry="15" transform="rotate(60 50 50)"/><ellipse cx="50" cy="50" rx="44" ry="15" transform="rotate(120 50 50)"/><circle cx="50" cy="50" r="12"/><circle cx="50" cy="50" r="6" fill="#C9A050" stroke="none"/></svg>
          <p class="hero__eyebrow" data-i18n="heroEyebrow"></p>
          <h1 id="heroTitle" class="hero__title"><span class="hero__title-main">QUANTUM</span><span class="hero__title-sub">Psychology</span></h1>
          <div class="hero__divider" aria-hidden="true"><span></span><i></i><svg viewBox="0 0 40 40" fill="none" stroke="#C9A050" stroke-width="1.5"><ellipse cx="20" cy="20" rx="17" ry="6"/><ellipse cx="20" cy="20" rx="17" ry="6" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="17" ry="6" transform="rotate(120 20 20)"/><circle cx="20" cy="20" r="3" fill="#C9A050" stroke="none"/></svg><i></i><span></span></div>
          <p class="hero__subtitle" data-i18n="heroSubtitle"></p>
          <ul class="hero__benefits">
            <li><svg class="hero__icon" viewBox="0 0 44 44" aria-hidden="true" fill="none" stroke="#8C6420" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 32V14c-2-4-8-4-10 0-4 0-6 5-3 8-3 4 0 9 4 9 2 4 7 4 9 1Zm0-18c2-4 8-4 10 0 4 0 6 5 3 8 3 4 0 9-4 9-2 4-7 4-9 1M14 18c3 0 5 2 5 5m-5 5c3 0 5-2 5-5m11-5c-3 0-5 2-5 5m5 5c-3 0-5-2-5-5"/></svg><span data-i18n="heroBenefit1"></span></li>
            <li><svg class="hero__icon" viewBox="0 0 44 44" aria-hidden="true" fill="none" stroke="#8C6420" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 13c-5 5-7 10 0 17 7-7 5-12 0-17Zm-3 16c-6-1-9-5-10-11 6 0 10 3 12 8m4 3c6-1 9-5 10-11-6 0-10 3-12 8M10 32c7 3 17 3 24 0"/></svg><span data-i18n="heroBenefit2"></span></li>
            <li><svg class="hero__icon" viewBox="0 0 44 44" aria-hidden="true" fill="none" stroke="#8C6420" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 32h25M12 28l8-8 5 4 9-12m-8 0h8v8"/></svg><span data-i18n="heroBenefit3"></span></li>
          </ul>
          <p class="hero__tagline" data-i18n="heroTagline"></p>
          <p class="hero__offer"><span class="hero__tag" data-i18n="heroTag"></span><span data-i18n="heroTagText"></span></p>
          <a class="button button--primary hero__cta" href="#leadForm"><span data-i18n="heroCta"></span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></a>
        </div>
      </section>

      <section class="section section--about" aria-labelledby="aboutTitle">
        <h2 id="aboutTitle" data-i18n="aboutTitle"></h2>
        <p id="introText" class="lead-copy"></p>
        <p id="twelveLine" class="twelve-line"></p>
      </section>

      <section class="section" aria-labelledby="modulesTitle">
        <h2 id="modulesTitle" data-i18n="modulesTitle"></h2>
        <p class="section__hint" data-i18n="chipsHint"></p>
        <div id="modulesList" class="module-grid"></div>
      </section>

      <section class="section section--feature" aria-labelledby="goalTitle">
        <h2 id="goalTitle"></h2>
        <p id="goalText" class="lead-copy"></p>
      </section>

      <section class="section" aria-labelledby="audienceTitle">
        <h2 id="audienceTitle"></h2>
        <ul id="audienceList" class="audience-list"></ul>
      </section>

      <section class="section section--story" aria-labelledby="founderTitle">
        <h2 id="founderTitle" data-i18n="founderTitle"></h2>
        <p data-i18n="founderP1"></p>
        <p data-i18n="founderP2"></p>
        <p data-i18n="founderP3"></p>
      </section>

      <section class="section" aria-labelledby="consultationTitle">
        <h2 id="consultationTitle" data-i18n="consultationTitle"></h2>
        <ol class="steps">
          <li><span class="steps__number">01</span><p data-i18n="consultationStep1"></p></li>
          <li><span class="steps__number">02</span><p data-i18n="consultationStep2"></p></li>
          <li><span class="steps__number">03</span><p data-i18n="consultationStep3"></p></li>
        </ol>
      </section>

      <section class="section section--form" aria-labelledby="formTitle">
        <h2 id="formTitle" data-i18n="formTitle"></h2>
        <p class="section__intro" data-i18n="formIntro"></p>
        <p class="required-hint" data-i18n="requiredHint"></p>
        <form id="leadForm" novalidate>
          <div class="field" data-field="name">
            <label for="name" data-i18n="nameLabel"></label>
            <input id="name" name="name" type="text" autocomplete="name" aria-describedby="nameHint nameError" data-i18n-placeholder="namePlaceholder">
            <small id="nameHint" data-i18n="nameHint"></small><p id="nameError" class="field__error" data-error-for="name" hidden></p>
          </div>
          <div class="field" data-field="age">
            <label for="age" data-i18n="ageLabel"></label>
            <input id="age" name="age" type="number" inputmode="numeric" aria-describedby="ageHint ageError" data-i18n-placeholder="agePlaceholder">
            <small id="ageHint" data-i18n="ageHint"></small><p id="ageError" class="field__error" data-error-for="age" hidden></p>
          </div>
          <div class="field" data-field="phone">
            <label for="phone" data-i18n="phoneLabel"></label>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" aria-describedby="phoneHint phoneError" data-i18n-placeholder="phonePlaceholder">
            <small id="phoneHint" data-i18n="phoneHint"></small><p id="phoneError" class="field__error" data-error-for="phone" hidden></p>
          </div>
          <div class="field" data-field="region">
            <label for="region" data-i18n="regionLabel"></label>
            <select id="region" name="region" aria-describedby="regionError"><option value="" data-i18n="regionPlaceholder"></option></select>
            <p id="regionError" class="field__error" data-error-for="region" hidden></p>
          </div>
          <fieldset class="field field--topics" data-field="topics" aria-describedby="topicsHint topicsError">
            <legend data-i18n="topicsLabel"></legend>
            <small id="topicsHint" data-i18n="topicsHint"></small>
            <div id="topicsList" class="topic-list"></div>
            <p id="topicsError" class="field__error" data-error-for="topics" hidden></p>
          </fieldset>
          <div class="field" data-field="prior">
            <label for="prior" data-i18n="priorLabel"></label>
            <select id="prior" name="prior" aria-describedby="priorError"><option value="" data-i18n="priorPlaceholder"></option></select>
            <p id="priorError" class="field__error" data-error-for="prior" hidden></p>
          </div>
          <div class="field" data-field="call_time">
            <label for="call_time" data-i18n="callTimeLabel"></label>
            <select id="call_time" name="call_time" aria-describedby="callTimeError"><option value="" data-i18n="callTimePlaceholder"></option></select>
            <p id="callTimeError" class="field__error" data-error-for="call_time" hidden></p>
          </div>
          <div id="sourceField" class="field" data-field="source">
            <label for="source" data-i18n="sourceLabel"></label>
            <select id="source" name="source" aria-describedby="sourceError"><option value="" data-i18n="sourcePlaceholder"></option></select>
            <p id="sourceError" class="field__error" data-error-for="source" hidden></p>
          </div>
          <div class="field" data-field="comment">
            <div class="field__row"><label for="comment" data-i18n="commentLabel"></label><span id="commentCounter" class="field__counter"></span></div>
            <textarea id="comment" name="comment" rows="4" aria-describedby="commentHint commentError" data-i18n-placeholder="commentPlaceholder"></textarea>
            <small id="commentHint" data-i18n="commentHint"></small><p id="commentError" class="field__error" data-error-for="comment" hidden></p>
          </div>
          <div class="field field--consent" data-field="consent">
            <label class="consent"><input id="consent" name="consent" type="checkbox" aria-describedby="consentError"><span data-i18n="consentText"></span></label>
            <p id="consentError" class="field__error" data-error-for="consent" hidden></p>
          </div>
          <button id="submitButton" class="button button--gold" type="submit" data-i18n="submit" disabled></button>
          <p id="formMessage" class="form-message" role="status" aria-live="polite" hidden></p>
        </form>
        <div id="successPanel" class="success-panel" role="status" hidden>
          <h3 data-i18n="successTitle"></h3><p data-i18n="successText"></p>
        </div>
      </section>
      <p class="disclaimer" data-i18n="disclaimer"></p>
      <footer class="closing" id="closingText"></footer>
    </main>
  </div>
</body>
</html>
