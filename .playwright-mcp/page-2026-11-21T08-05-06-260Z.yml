          - /url: "#leadForm"
    - region "Дастур ҳақида" [ref=e17]:
      - heading "Дастур ҳақида" [level=2] [ref=e18]
      - paragraph [ref=e19]: Ушбу курс — инсоннинг ўзини англаши, ички қувватини бошқариши, онгости дастурларини ўрганиши ва ҳаёт сифатини яхшилашига қаратилган тизимли таълим дастури.
      - paragraph [ref=e20]: 12 ой — 12 модуль — ўзгаришнинг 12 босқичи.
    - region "12 модуль" [ref=e21]:
      - heading "12 модуль" [level=2] [ref=e22]
      - paragraph [ref=e23]: Танланган мавзуларга оид модуллар ажратиб кўрсатилади.
      - generic [ref=e24]:
        - article [ref=e25]:
          - text: "01"
          - heading "ЎЗИНИ БОШҚАРИШ" [level=3] [ref=e26]
          - paragraph [ref=e27]: Ҳиссиётлар, фикрлар ва ички ҳолатни бошқариш. Қувватни тўплаш, сақлаш ва мақсад сари йўналтириш.
        - article [ref=e28]:
          - text: "02"
          - heading "ҲАЁТ ҚОНУНИЯТЛАРИ" [level=3] [ref=e29]
          - paragraph [ref=e30]: Илоҳий қонунлар, сабаб ва оқибат, мувозанат, шахсий чегаралар, тортишиш кучи ва қувват алмашинуви.
        - article [ref=e31]:
          - text: "03"
          - heading "ОТА-ОНА ВА МУСТАҚИЛ ШАХС" [level=3] [ref=e32]
          - paragraph [ref=e33]: Ота-она билан муносабатлар, болаликда шаклланган дастурлар, миннатдорлик, ҳиссий мустақиллик ва ўзига таяниш.
        - article [ref=e34]:
          - text: "04"
          - heading "ОНГОСТИ ДАСТУРЛАРИ ВА МАҚСАДЛАР" [level=3] [ref=e35]
          - paragraph [ref=e36]: Аждодлардан ўтган ҳаётий сценарийлар, ички чекловлар, қўрқувлар, ўзига ишонч ва мақсадга эришиш стратегиялари.
        - article [ref=e37]:
          - text: "05"
          - heading "РУҲИЙ РИВОЖЛАНИШ" [level=3] [ref=e38]
          - paragraph [ref=e39]: Бирлик онги, кармик сценарийлар, қалб поклиги, руҳий озуқа, илоҳий қадриятлар ва ҳаёт мазмуни.
        - article [ref=e40]:
          - text: "06"
          - heading "ИЧКИ ДУНЁ ВА ТАШҚИ ҲАЁТ" [level=3] [ref=e41]
          - paragraph [ref=e42]: Ички қисмлар, пул, бойлик, севги ва муносабатлар. Розилик, масъулият, имкониятларни кенгайтириш ва келажакни шакллантириш.
        - article [ref=e43]:
          - text: "07"
          - heading "ОНГНИ КЕНГАЙТИРИШ" [level=3] [ref=e44]
          - paragraph [ref=e45]: Интуицияни ривожлантириш, вазиятларга турли нуқтаи назардан қараш, севги, руҳий бирлик ва илоҳий масъулият.
        - article [ref=e46]:
          - text: "08"
          - heading "ТАНА ВА ИЧКИ ҲОЛАТ" [level=3] [ref=e47]
          - paragraph [ref=e48]: Тана билан муносабат, ҳиссий зўриқишлар, ички хотиржамлик, соғлом одатлар ва ўзини асраш.
        - article [ref=e49]:
          - text: "09"
          - heading "ПУЛ ВА ФАРОВОНЛИК" [level=3] [ref=e50]
          - paragraph [ref=e51]: Пулга нисбатан онгости қарашлари, етишмовчилик ҳисси, ўз қадрини англаш, молиявий масъулият ва даромадни ошириш стратегиялари.
        - article [ref=e52]:
          - text: "10"
          - heading "СЕВГИ ВА МУНОСАБАТЛАР" [level=3] [ref=e53]
          - paragraph [ref=e54]: Эркак ва аёл муносабатлари, фарзандлар билан мулоқот, оилавий сценарийлар, ҳурмат ва соғлом шахсий чегаралар.
        - article [ref=e55]:
          - text: "11"
          - heading "ЎЗ САЛОҲИЯТИНИ РЎЁБГА ЧИҚАРИШ" [level=3] [ref=e56]
          - paragraph [ref=e57]: Лойиқлик, ички таянч, шахсий салоҳият, ҳаётий мақсадлар, қарор қабул қилиш ва янги даражага ўтиш.
        - article [ref=e58]:
          - text: "12"
          - heading "ТЎЛИҚ ТАКРОРЛАШ ВА МУСТАҲКАМЛАШ" [level=3] [ref=e59]
          - paragraph [ref=e60]: Барча 11 модулни такрорлаш, билим ва кўникмаларни текшириш, коррекция қилиш, натижаларни таҳлил қилиш ва келгуси ҳаёт стратегиясини яратиш.
    - region "Дастурнинг асосий мақсади" [ref=e61]:
