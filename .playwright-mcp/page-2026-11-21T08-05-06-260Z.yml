    - region "Менинг йўлим" [ref=e87]:
      - heading "Менинг йўлим" [level=2] [ref=e88]
      - paragraph [ref=e89]: Ўн саккиз йил ногиронлик билан яшадим. Оддий ҳаракат қилиш ва эркин юриш мен учун катта орзу эди. Шу кунларда ҳам ҳаётим ўзгариши мумкинлигига ишончимни сақладим.
      - paragraph [ref=e90]: Бугун эркин ҳаракатланаман ва ҳар бир кунимнинг қадрини чуқурроқ ҳис қиламан. Йиллар давомида олган билимларим, изланишларим ва шахсий тажрибам асосида QUANTUM Psychology тизимини яратдим.
      - paragraph [ref=e91]: Бу тизим орқали инсонларга ўзини яхшироқ англаш ва ички тўсиқлар устида ишлашда ёрдам беришни мақсад қилдим. Баъзан ҳаётимиздаги энг катта ўзгариш ўзимизга бўлган муносабатимизни ўзгартиришдан бошланади.
    - region "Бепул суҳбатда нима бўлади" [ref=e92]:
